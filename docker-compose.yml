services:
  postgres:
    image: postgres:17-alpine
    # Credentials come from .env (see .env.example), never from this file, so the
    # same values configure Compose and the API.
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
